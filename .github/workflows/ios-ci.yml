name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write   # publish small media to the ci-artifacts branch

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ANALYTICS: 1

jobs:
  ui-test:
    # Runs only when you start it by hand (Actions tab or `gh workflow run`)
    # or when the commit message contains [ci]. Other pushes skip it instantly.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci]')
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Start booting the simulator FIRST. `simctl boot` returns quickly and the boot
      # carries on in the background while the app compiles.
      - name: Pick an iPhone simulator and start booting it
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key) | last
            | .value | map(select(.name | startswith("iPhone"))) | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-ffmpeg-v1

      # The Xcode project (TapFrenzy.xcodeproj) is committed to the repo,
      # so no project generator is needed here.

      # Compile the app and the tests (no simulator needed yet).
      # ffmpeg installs in parallel, because it is only needed after the test.
      - name: Build the app and tests
        shell: bash
        run: |
          set -uo pipefail
          ( command -v ffmpeg >/dev/null || brew install ffmpeg ) > ffmpeg-install.log 2>&1 &
          FFMPEG_PID=$!

          xcodebuild build-for-testing \
            -project TapFrenzy.xcodeproj \
            -scheme TapFrenzy \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          wait "$FFMPEG_PID" || echo "ffmpeg install failed - see ffmpeg-install.log"
          exit "$BUILD_STATUS"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$UDID" -b

      # The recording now covers only the test run, not the build.
      # -only-testing:TapFrenzyUITests runs only the UI test bundle.
      - name: Run UI tests while recording the screen
        shell: bash
        run: |
          set -uo pipefail
          xcrun simctl io "$UDID" recordVideo --codec=h264 recording.mov &
          REC_PID=$!
          sleep 1

          xcodebuild test-without-building \
            -project TapFrenzy.xcodeproj \
            -scheme TapFrenzy \
            -only-testing:TapFrenzyUITests \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild.log
          TEST_STATUS=${PIPESTATUS[0]}

          # Give the recorder time to write the end of the file before stopping it
          sleep 3
          kill -SIGINT "$REC_PID" || true
          wait "$REC_PID" || true
          ls -l recording.mov || echo "No recording file was created"
          exit "$TEST_STATUS"

      # MP4 for a full-quality link, plus a small GIF that shows inline in the summary.
      # If ffmpeg is missing, the raw .mov is published instead.
      - name: Compress the recording
        if: always()
        continue-on-error: true
        run: |
          mkdir -p media
          if [ -f recording.mov ] && command -v ffmpeg >/dev/null; then
            ffmpeg -y -loglevel error -i recording.mov \
              -vf "scale=-2:900,fps=15" \
              -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p \
              -movflags +faststart -an media/recording.mp4
            ffmpeg -y -loglevel error -i recording.mov \
              -vf "fps=8,scale=360:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
              -loop 0 media/recording.gif
          elif [ -f recording.mov ]; then
            cp recording.mov media/recording.mov
          fi
          ls -lh media || true

      - name: Collect and shrink screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p media
          xcrun simctl io "$UDID" screenshot final-screen.png || true
          if [ -f final-screen.png ]; then
            sips -Z 1000 -s format jpeg -s formatOptions 70 final-screen.png --out media/final-screen.jpg >/dev/null
          fi
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-screenshots || true
          if [ -f test-screenshots/manifest.json ]; then
            jq -r '.[].attachments[]? | select(.exportedFileName and .suggestedHumanReadableName)
                   | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' test-screenshots/manifest.json |
            while IFS=$'\t' read -r file label; do
              name=$(echo "$label" | sed -E 's/_[0-9]+_[0-9A-F-]+\.png$//; s/\.png$//')
              sips -Z 1000 -s format jpeg -s formatOptions 70 "test-screenshots/$file" --out "media/$name.jpg" >/dev/null || true
            done
          fi
          ls -lh media || true

      - name: Publish media to the ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A media 2>/dev/null)" ]; then
            echo "No media to publish"; exit 0
          fi
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB="$RUNNER_TEMP/pub"
          rm -rf "$PUB" && mkdir -p "$PUB/latest"
          cp media/* "$PUB/latest/"
          echo "Run $GITHUB_RUN_NUMBER, commit ${GITHUB_SHA}" > "$PUB/latest/RUN.txt"
          cd "$PUB"
          git init -q -b ci-artifacts
          git remote add origin "$REPO_URL"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "CI media for run $GITHUB_RUN_NUMBER"
          git push -q -f origin ci-artifacts

      - name: Write links to the run summary
        if: always()
        env:
          BASE: https://github.com/${{ github.repository }}
        run: |
          {
            echo "## iOS UI test results"
            echo ""
            if [ -f media/recording.gif ]; then
              echo "![recording]($BASE/raw/ci-artifacts/latest/recording.gif)"
              echo ""
            fi
            for v in recording.mp4 recording.mov; do
              if [ -f "media/$v" ]; then
                echo "Full video: [$v]($BASE/blob/ci-artifacts/latest/$v)"
                echo ""
              fi
            done
            echo "### Screenshots"
            for img in media/*.jpg; do
              [ -f "$img" ] || continue
              name=$(basename "$img")
              echo "![$name]($BASE/raw/ci-artifacts/latest/$name)"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Small text logs only. Look here for the per-step timings ("t = 12.3s ...").
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      # Zip the simulator app so it can be uploaded to Appetize
      - name: Package simulator app for Appetize
        if: always()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "TapFrenzy.app" -type d)
          if [ -z "$APP" ]; then echo "No simulator app found"; exit 0; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" TapFrenzy-simulator.zip
          ls -lh TapFrenzy-simulator.zip

      - name: Upload simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TapFrenzy-simulator-app
          path: TapFrenzy-simulator.zip
          if-no-files-found: warn
          retention-days: 7
