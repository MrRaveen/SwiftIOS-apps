name: TapFrenzy

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  TapFrenzy:
    type: application
    platform: iOS
    sources:
      - path: TapFrenzy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TapFrenzy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tap Frenzy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  TapFrenzyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TapFrenzyTests
    dependencies:
      - target: TapFrenzy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TapFrenzyTests
        GENERATE_INFOPLIST_FILE: YES

  TapFrenzyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TapFrenzyUITests
    dependencies:
      - target: TapFrenzy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TapFrenzyUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TapFrenzy:
    build:
      targets:
        TapFrenzy: all
    test:
      targets:
        - TapFrenzyTests
        - TapFrenzyUITests